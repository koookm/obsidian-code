name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Build before test: the bundle-load test evaluates the built main.js,
      # which is how a bundling regression gets caught before release.
      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Check built artifacts are committed
        run: |
          if ! git diff --quiet -- main.js styles.css; then
            echo "::error::main.js / styles.css are out of date. Run 'npm run build' and commit the result."
            git diff --stat -- main.js styles.css
            exit 1
          fi
